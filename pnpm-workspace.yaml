packages:
  - frontend

catalog:
  prettier: 3.8.4
  prettier-plugin-svelte: 4.1.0
  prettier-plugin-tailwindcss: 0.8.0

minimumReleaseAge: 10080
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - eslint-config-prettier@9.1.2
  - rollup@2.80.0
  - semver@6.3.1

overrides:
  sharp: 0.35.5
  '@sveltejs/enhanced-img>sharp': 0.35.5
  '@yohawing/three-mmd-loader>@types/three': 0.177.0
  '@xmldom/xmldom': 0.8.15
  thrift: 0.23.0
  tmp: 0.2.6
  # Paired with the fgdb and gh-pages API compatibility patches below.
  'fgdb>jszip': ^3.10.1
  'gh-pages>globby': npm:tinyglobby@^0.2.17
  # Older consumers support these APIs but retain vulnerable dependency ranges.
  'sveltekit-search-params>@sveltejs/vite-plugin-svelte': ^5.1.1
  'landxml>@vitest/web-worker': ^4.1.11
  'gpxparser>jsdom': ^26.1.0
  '@loaders.gl/core': ^4.5.3
  '@loaders.gl/textures': ^4.5.3
  '@loaders.gl/xml': ^4.5.3
  '@sveltejs/kit>cookie': ^0.7.2
  '@rollup/plugin-terser>serialize-javascript': ^7.0.5
  'minimatch@<3.1.4': ^3.1.4
  'minimatch@>=9 <9.0.7': ^9.0.7
  'brace-expansion@<1.1.21': ^1.1.21
  'ajv@<6.14.0': ^6.14.0
  flatted: ^3.4.2
  'yaml@<1.10.3': ^1.10.3
  markdown-it: ^14.3.1
  linkify-it: ^5.0.2
  'js-yaml@>=4 <4.3.2': ^4.3.2
  protocol-buffers-schema: ^3.6.1
  postcss-selector-parser: ^7.1.6
  '@humanfs/node': ^0.16.8
  'fflate@>=0.7 <0.7.5': ^0.7.5
  colord: ^2.9.4
  smol-toml: ^1.9.0
  # Keep the rendering packages on the deck.gl 9.2-compatible series.
  '@deck.gl/aggregation-layers': ~9.2.11
  '@luma.gl/constants': ~9.2.6
  '@luma.gl/core': ~9.2.6
  '@luma.gl/engine': ~9.2.6
  '@luma.gl/gltf': ~9.2.6
  '@luma.gl/shadertools': ~9.2.6
  '@luma.gl/webgl': ~9.2.6

ignoredBuiltDependencies:
  - better-sqlite3

allowBuilds:
  core-js: false
  dprint: true
  esbuild: true
  msw: false
  sharp: true

patchedDependencies:
  fgdb@1.0.0: patches/fgdb@1.0.0.patch
  gh-pages@6.3.0: patches/gh-pages@6.3.0.patch
  maplibre-gl@6.4.1: patches/maplibre-gl@6.4.1.patch
